project: rock

backends:
  craft:
    type: craft
    systems:
      - ubuntu-24.04:
      #- ubuntu-22.04:

suites:
  spread/general/:
    summary: General integration tests
    environment:
      # Goss environment
      GOSS_OPTS: "--retry-timeout=120s"
      GOSS_FILES_STRATEGY: cp
      DGOSS_TEMP_DIR: "$HOME"

    prepare: |
      # Install dependencies
      sudo snap install docker

      # Pin goss + dgoss to a fixed release: upstream `goss.rocks/install` now
      # builds a goreleaser .tar.gz URL that release v0.4.9 doesn't publish (404).
      GOSS_VER=v0.4.9
      sudo curl -fsSL -o /usr/local/bin/goss "https://github.com/goss-org/goss/releases/download/${GOSS_VER}/goss-linux-amd64"
      echo "87dd36cfa1b8b50554e6e2ca29168272e26755b19ba5438341f7c66b36decc19  /usr/local/bin/goss" | sha256sum -c -
      sudo curl -fsSL -o /usr/local/bin/dgoss "https://raw.githubusercontent.com/goss-org/goss/${GOSS_VER}/extras/dgoss/dgoss"
      sudo chmod +rx /usr/local/bin/goss /usr/local/bin/dgoss

      # For 'rockcraft.skopeo'
      sudo snap install --classic rockcraft

      # Wait for docker daemon to come online
      for i in $(seq 1 10); do docker info >/dev/null 2>&1 && break || sleep 2; done

      # Load the rock into docker
      sudo rockcraft.skopeo --insecure-policy copy "oci-archive:$CRAFT_ARTIFACT" docker-daemon:rockcraft-test:latest
      
    restore: |
      docker image rm --force rockcraft-test:latest

exclude:
  - .git

kill-timeout: 1h
